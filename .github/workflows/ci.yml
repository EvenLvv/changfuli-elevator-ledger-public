name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check and build frontend
        run: npm run typecheck && npm run build
        working-directory: frontend
      - name: Test backend and installer helpers
        env:
          ELEVATOR_DATA_DIR: ${{ runner.temp }}/elevator-ci/data
          ELEVATOR_STORAGE_DIR: ${{ runner.temp }}/elevator-ci/storage
          ELEVATOR_EXPORT_DIR: ${{ runner.temp }}/elevator-ci/exports
          ELEVATOR_BACKUP_DIR: ${{ runner.temp }}/elevator-ci/backups
          ELEVATOR_LOG_DIR: ${{ runner.temp }}/elevator-ci/logs
        run: python -m unittest discover -s tests -v
